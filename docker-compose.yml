services:
  tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seti_tests
    environment:
      - PYTHONPATH=/app

  stage1_tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seti_stage1_tests
    command: ["python", "-m", "pytest", "tests/test_framing.py", "-v"]
    environment:
      - PYTHONPATH=/app

  stage2_tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seti_stage2_tests
    command: ["python", "-m", "pytest", "tests/test_kademlia.py", "-v"]
    environment:
      - PYTHONPATH=/app

  stage3_tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seti_stage3_tests
    command: ["python", "-m", "pytest", "tests/test_storage_and_replication.py", "-v"]
    environment:
      - PYTHONPATH=/app

  stage4_tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seti_stage4_tests
    command: ["python", "-m", "pytest", "tests/test_secure_channel.py", "-v"]
    environment:
      - PYTHONPATH=/app

  stage1_demo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seti_stage1_demo
    command: ["python", "demos/demo_stage1.py"]
    environment:
      - PYTHONPATH=/app

  stage2_demo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seti_stage2_demo
    command: ["python", "demos/demo_stage2.py"]
    environment:
      - PYTHONPATH=/app

  stage3_demo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seti_stage3_demo
    command: ["python", "demos/demo_stage3.py"]
    environment:
      - PYTHONPATH=/app

  stage4_demo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seti_stage4_demo
    command: ["python", "demos/demo_stage4.py"]
    environment:
      - PYTHONPATH=/app


  stage4_demo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seti_stage4_demo
    command: ["python", "demos/demo_stage4.py"]
    environment:
      - PYTHONPATH=/app